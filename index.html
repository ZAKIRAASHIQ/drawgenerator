<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumite Draw Generator</title>
<meta name="theme-color" content="#3c3489">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kumite Draw">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fafaf7;--card:#ffffff;--fg:#1f1f1c;--muted:#6b6a64;--line:#8a887f;--border:#dddbd2;--accent:#3c3489;--aka:#c0392b;--ao:#1f5fa8;--ok:#2f7a1f;--warn:#a5521a;--chip:#efeee8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#262624;--fg:#ecebe6;--muted:#a3a19a;--line:#8f8d86;--border:#3a3936;--accent:#afa9ec;--aka:#f08080;--ao:#7fb2f0;--ok:#97c459;--warn:#ef9f27;--chip:#30302d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
textarea{min-height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.row{display:grid;grid-template-columns:1fr 160px;gap:12px;margin-bottom:12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;margin:10px 0 14px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--border);background:var(--chip);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#1c1c1a}}
.err{color:var(--warn);font-size:14px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:8px;padding:8px 12px;min-width:110px}
.chip b{display:block;font-size:20px}
.chip span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
.aka{color:var(--aka);font-weight:600}.ao{color:var(--ao);font-weight:600}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--warn);font-weight:600}
.legend{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
#out{display:none}
@media print{body{background:#fff;color:#000}main{max-width:none;padding:0}.noprint,#inputCard,.btns{display:none!important}.card{border:none;padding:0 0 10px;break-inside:avoid}#clubCard{break-before:page}}
</style>
</head>
<body>
<main>
<h1>Kumite draw generator</h1>
<p class="sub">Type the number of participants, or paste the names. The draw follows the formula: bracket = next of 4, 8, 16, 32, 64 · BYEs = bracket − players · total bouts = players − 1.</p>

<section class="card" id="inputCard">
  <div class="row">
    <div>
      <label for="cat">Category <span class="hint">(optional, shown on the draw)</span></label>
      <input id="cat" type="text" placeholder="e.g. Kumite U-12 Boys −35 kg">
    </div>
    <div>
      <label for="count">Participants</label>
      <input id="count" type="number" min="2" max="64" value="10">
    </div>
  </div>
  <label for="names">Names <span class="hint">— one per line: Name, Club, Seed. Club and seed are optional. Leave empty to use the number above.</span></label>
  <textarea id="names" placeholder="Ali, X, 1&#10;Ben&#10;Dev, Y&#10;Raj, X&#10;Sam&#10;Kavi, Y, 2"></textarea>
  <label class="check"><input id="sep" type="checkbox" checked> Keep same-club players apart</label>
  <div class="btns">
    <button class="primary" id="go">Generate draw</button>
    <button id="again">Re-draw (new chits)</button>
    <button id="clear">Clear names</button>
  </div>
  <div class="err" id="err"></div>
</section>

<div id="out">
  <section class="card">
    <h2 id="title">Draw</h2>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card">
    <h2>Bracket</h2>
    <div class="scroll"><svg id="svg" role="img" aria-label="Knockout bracket"></svg></div>
    <div class="legend"><span><span class="dot" style="background:var(--aka)"></span>AKA (top of each bout)</span><span><span class="dot" style="background:var(--ao)"></span>AO (bottom)</span><span>B1, B2… = bout numbers</span></div>
  </section>

  <section class="card">
    <h2>Order of bouts</h2>
    <div class="scroll"><table id="bouts"></table></div>
    <div class="btns" style="margin-top:12px"><button id="share">Share bout list</button><button id="copy">Copy bout list</button><button id="print">Print / Save PDF</button><span id="copied" class="hint" style="align-self:center"></span></div>
  </section>

  <section class="card" id="clubCard">
    <h2>Club check</h2>
    <div class="scroll"><table id="clubs"></table></div>
  </section>
</div>
</main>

<script>
/*CORE*/
function seedOrder(S){
  let o=[1];
  while(o.length<S){const n=o.length*2,next=[];for(const x of o){next.push(x,n+1-x);}o=next;}
  if(S>=4){const h=S/2;o=o.slice(0,h).concat(o.slice(h).reverse());}
  return o;
}
function meetRound(i,j){return Math.floor(Math.log2(i^j))+1;}
function roundName(R,r){const left=R-r;if(left===1)return'Final';if(left===2)return'Semi-final';if(left===3)return'Quarter-final';return'Round of '+Math.pow(2,left);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDraw(players,sep){
  const N=players.length;let S=2;while(S<N)S*=2;const R=Math.log2(S);
  const order=seedOrder(S),rankPos={};order.forEach((r,i)=>rankPos[r]=i);
  const playerPos=[];for(let i=0;i<S;i++)if(order[i]<=N)playerPos.push(i);
  const fixed=new Map(),warnings=[],used=new Set();
  players.forEach(p=>{p._seed=null;});
  players.filter(p=>p.seed!=null).sort((a,b)=>a.seed-b.seed).forEach(p=>{
    if(p.seed<1||p.seed>N||used.has(p.seed)){warnings.push('Seed '+p.seed+' for '+p.name+' was ignored.');return;}
    used.add(p.seed);p._seed=p.seed;fixed.set(rankPos[p.seed],p);
  });
  const freePos=playerPos.filter(pos=>!fixed.has(pos));
  const free=players.filter(p=>p._seed==null);
  function penalty(at){
    const byClub={};let pen=0;
    for(let i=0;i<S;i++){const p=at[i];if(p&&p.club)(byClub[p.club]=byClub[p.club]||[]).push(i);}
    for(const k in byClub){const a=byClub[k];for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++)pen+=Math.pow(4,R-meetRound(a[x],a[y]));}
    return pen;
  }
  let best=null,bestPen=Infinity;
  const restarts=sep?12:1;
  for(let r=0;r<restarts;r++){
    const at=new Array(S).fill(null);fixed.forEach((p,pos)=>at[pos]=p);
    const sh=shuffle(free.slice());freePos.forEach((pos,i)=>at[pos]=sh[i]);
    let pen=penalty(at);
    if(sep&&freePos.length>1&&pen>0){
      for(let it=0;it<3000&&pen>0;it++){
        const a=freePos[Math.floor(Math.random()*freePos.length)],b=freePos[Math.floor(Math.random()*freePos.length)];
        if(a===b)continue;const pa=at[a],pb=at[b];if(pa.club===pb.club)continue;
        at[a]=pb;at[b]=pa;const np=penalty(at);
        if(np<=pen)pen=np;else{at[a]=pa;at[b]=pb;}
      }
    }
    if(pen<bestPen){bestPen=pen;best=at.slice();}
  }
  const at=best;
  for(let m=0;m<S/2;m++){if(!at[2*m]&&at[2*m+1]){at[2*m]=at[2*m+1];at[2*m+1]=null;}}
  const bout=[],list=[];let no=0;
  for(let r=0;r<R;r++){
    bout[r]=[];const len=S>>(r+1);
    for(let m=0;m<len;m++){
      const real=r>0||(at[2*m]&&at[2*m+1]);
      if(real){no++;bout[r][m]=no;list.push({no:no,r:r,m:m});}else bout[r][m]=null;
    }
  }
  function slotLabel(r,k){
    if(r===0)return at[k]?at[k].name:'BYE';
    if(r===1&&bout[0][k]===null){const p=at[2*k]||at[2*k+1];return p.name;}
    return 'Winner of B'+bout[r-1][k];
  }
  const clubs={};
  for(let i=0;i<S;i++){const p=at[i];if(p&&p.club)(clubs[p.club]=clubs[p.club]||[]).push({p:p,pos:i});}
  const clubRows=[];
  Object.keys(clubs).sort().forEach(c=>{
    const mem=clubs[c];if(mem.length<2)return;
    let earliest=R+1;for(let x=0;x<mem.length;x++)for(let y=x+1;y<mem.length;y++)earliest=Math.min(earliest,meetRound(mem[x].pos,mem[y].pos));
    const bestPossible=Math.max(1,R-Math.ceil(Math.log2(mem.length))+1);
    clubRows.push({club:c,members:mem.map(m=>m.p.name),earliest:earliest,bestPossible:bestPossible,ok:earliest>=bestPossible});
  });
  return {N:N,S:S,R:R,at:at,bout:bout,list:list,slotLabel:slotLabel,clubRows:clubRows,warnings:warnings,byes:S-N,firstBouts:N-S/2};
}
/*ENDCORE*/

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function parsePlayers(){
  const lines=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const players=[];
  if(lines.length){
    lines.forEach((line,i)=>{
      const parts=line.split(',').map(s=>s.trim());
      const seed=parseInt(parts[2],10);
      players.push({id:i,name:parts[0]||('Player '+(i+1)),club:(parts[1]||'').toUpperCase(),seed:Number.isFinite(seed)?seed:null});
    });
    $('count').value=players.length;
  }else{
    const n=parseInt($('count').value,10);
    for(let i=0;i<n;i++)players.push({id:i,name:'Player '+(i+1),club:'',seed:null});
  }
  return players;
}

let last=null;
function run(){
  $('err').textContent='';
  const players=parsePlayers();
  if(!(players.length>=2&&players.length<=64)){$('err').textContent='Enter between 2 and 64 participants.';$('out').style.display='none';return;}
  try{localStorage.setItem('drawgen',JSON.stringify({cat:$('cat').value,count:$('count').value,names:$('names').value,sep:$('sep').checked}));}catch(e){}
  const d=makeDraw(players,$('sep').checked);last=d;
  if(d.warnings.length)$('err').textContent=d.warnings.join(' ');
  render(d);
}

function render(d){
  $('out').style.display='block';
  const cat=$('cat').value.trim();
  $('title').textContent=cat?cat:'Draw';
  const chips=[[d.N,'Participants'],[d.S,'Bracket lines'],[d.firstBouts,'Round 1 bouts'],[d.byes,'BYEs'],[d.N-1,'Total bouts']];
  $('chips').innerHTML=chips.map(c=>'<div class="chip"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');
  drawSVG(d);
  // bout table
  let h='<tr><th>Bout</th><th>Round</th><th>AKA (red)</th><th>AO (blue)</th></tr>';
  d.list.forEach(b=>{
    h+='<tr><td><b>B'+b.no+'</b></td><td>'+roundName(d.R,b.r)+'</td><td class="aka">'+esc(d.slotLabel(b.r,2*b.m))+'</td><td class="ao">'+esc(d.slotLabel(b.r,2*b.m+1))+'</td></tr>';
  });
  $('bouts').innerHTML=h;
  // clubs
  if(d.clubRows.length){
    let c='<tr><th>Club</th><th>Players</th><th>Earliest possible meeting</th><th>Check</th></tr>';
    d.clubRows.forEach(r=>{
      c+='<tr><td><b>'+esc(r.club)+'</b></td><td>'+esc(r.members.join(', '))+'</td><td>'+roundName(d.R,r.earliest-1)+'</td><td>'+(r.ok?'<span class="ok">✓ Best possible</span>':'<span class="warn">Could be later ('+roundName(d.R,r.bestPossible-1)+')</span>')+'</td></tr>';
    });
    $('clubs').innerHTML=c;$('clubCard').style.display='block';
  }else $('clubCard').style.display='none';
}

function drawSVG(d){
  const S=d.S,R=d.R,LH=S>=32?26:32,COLW=160,top=14,left=8;
  const ys=[[]];for(let i=0;i<S;i++)ys[0][i]=top+i*LH+LH-6;
  for(let r=1;r<=R;r++){ys[r]=[];for(let k=0;k<(S>>r);k++)ys[r][k]=(ys[r-1][2*k]+ys[r-1][2*k+1])/2;}
  const W=left+R*COLW+COLW+10,H=top+S*LH+16;
  const css=getComputedStyle(document.documentElement);
  const col=n=>css.getPropertyValue(n).trim();
  const line=col('--line'),fg=col('--fg'),muted=col('--muted'),aka=col('--aka'),ao=col('--ao'),accent=col('--accent');
  let s='';
  for(let r=0;r<=R;r++){
    const x1=left+r*COLW,x2=x1+COLW;
    for(let k=0;k<(S>>r);k++){
      const y=ys[r][k];
      s+='<line x1="'+x1+'" y1="'+y+'" x2="'+(r===R?x1+COLW-20:x2)+'" y2="'+y+'" stroke="'+line+'" stroke-width="1"/>';
      if(r<R)s+='<circle cx="'+(x1+7)+'" cy="'+(y-6)+'" r="3.5" fill="'+(k%2===0?aka:ao)+'"/>';
      let label='',color=fg,weight='500';
      if(r===0){
        const p=d.at[k];
        if(p){label=p.name+(p.club?' ('+p.club+')':'')+(p._seed?' ★'+p._seed:'');}else{label='BYE';color=muted;weight='400';}
      }else if(r===1&&d.bout[0][k]===null){const p=d.at[2*k]||d.at[2*k+1];label=p.name;color=muted;weight='400';}
      else if(r===R){label='Winner';color=muted;weight='400';}
      if(label)s+='<text x="'+(x1+15)+'" y="'+(y-4)+'" font-size="'+(S>=32?12:13)+'" font-weight="'+weight+'" fill="'+color+'">'+esc(label)+'</text>';
    }
    if(r<R){
      for(let m=0;m<(S>>(r+1));m++){
        const ya=ys[r][2*m],yb=ys[r][2*m+1];
        s+='<line x1="'+x2+'" y1="'+ya+'" x2="'+x2+'" y2="'+yb+'" stroke="'+line+'" stroke-width="1"/>';
        const b=d.bout[r][m];
        if(b)s+='<text x="'+(x2+6)+'" y="'+(ys[r+1][m]+14)+'" font-size="11" font-weight="700" fill="'+accent+'">B'+b+'</text>';
      }
    }
  }
  const svg=$('svg');svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.innerHTML=s;
}

$('go').addEventListener('click',run);
$('again').addEventListener('click',run);
$('clear').addEventListener('click',()=>{$('names').value='';});
function boutText(){
  const cat=$('cat').value.trim();
  const lines=[(cat?cat+' — ':'')+last.N+' participants, '+last.byes+' BYEs, '+(last.N-1)+' bouts'];
  last.list.forEach(b=>lines.push('B'+b.no+' ('+roundName(last.R,b.r)+'): AKA '+last.slotLabel(b.r,2*b.m)+' vs AO '+last.slotLabel(b.r,2*b.m+1)));
  return lines.join('\n');
}
$('print').addEventListener('click',()=>{if(last)window.print();});
$('share').addEventListener('click',async()=>{
  if(!last)return;
  if(navigator.share){try{await navigator.share({title:'Bout list',text:boutText()});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(boutText());$('copied').textContent='Sharing not supported — copied instead ✓';}catch(e){$('copied').textContent='Select the table text to copy.';}
});
$('copy').addEventListener('click',async()=>{
  if(!last)return;
  try{await navigator.clipboard.writeText(boutText());$('copied').textContent='Copied ✓';}
  catch(e){$('copied').textContent='Copy not allowed here — select the table text instead.';}
});
try{const s=JSON.parse(localStorage.getItem('drawgen')||'null');if(s){$('cat').value=s.cat||'';$('count').value=s.count||10;$('names').value=s.names||'';$('sep').checked=s.sep!==false;}}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
